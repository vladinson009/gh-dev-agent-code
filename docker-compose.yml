services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devscope
      POSTGRES_PASSWORD: devscope
      POSTGRES_DB: devscope
    ports:
      - "5432:5432"
    volumes:
      - devscope-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devscope -d devscope"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://devscope:devscope@postgres:5432/devscope
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      API_PORT: 4000
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["sh", "-c", "npm run db:migrate --workspace @devscope/api && npm run worker --workspace @devscope/api"]
    environment:
      DATABASE_URL: postgresql://devscope:devscope@postgres:5432/devscope
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TRACKED_GITHUB_USERNAMES: ${TRACKED_GITHUB_USERNAMES:-vercel}
      SNAPSHOT_INTERVAL_HOURS: ${SNAPSHOT_INTERVAL_HOURS:-6}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  devscope-postgres:
